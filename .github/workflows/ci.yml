# GitHub Actions configuration **EXAMPLE**,
# MODIFY IT ACCORDING TO YOUR NEEDS!
# Reference: https://docs.github.com/en/actions
name: tests

on:
  push:
    # Avoid using all the resources/limits available by checking only
    # relevant branches and tags. Other branches can be checked via PRs.
    branches: [main]
    tags: ['v[0-9]*', '[0-9]+.[0-9]+*']  # Match tags that resemble a version
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:  # Allow manually triggering the workflow

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref_type }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      wheel-distribution: ${{ steps.wheel-distribution.outputs.path }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}  # deep clone for setuptools-scm
      - uses: actions/setup-python@v7
        id: setup-python
        with: {python-version: "3.11"}
      - name: Run static analysis and format checkers
        run: pipx run pre-commit run --all-files --show-diff-on-failure
      - name: Build package distribution files
        run: >-
          pipx run --python '${{ steps.setup-python.outputs.python-path }}'
          tox -e clean,build
      - name: Record the path of wheel distribution
        id: wheel-distribution
        run: echo "path=$(ls dist/*.whl)" >> $GITHUB_OUTPUT
      - name: Store the distribution files for use in other stages
        # `tests` and `publish` will use the same pre-built distributions,
        # so we make sure to release the exact same package that was tested
        uses: actions/upload-artifact@v7
        with:
          name: python-distribution-files
          path: dist/
          retention-days: 1

  test:
    needs: prepare
    strategy:
      matrix:
        python:
        - "3.11"  # newest Python that is stable
        platform:
        - ubuntu-latest
        - macos-15
        - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
      - name: Retrieve pre-built distribution files
        uses: actions/download-artifact@v8
        with: {name: python-distribution-files, path: dist/}
      - name: Run tests
        run: >-
          pipx run --python '${{ steps.setup-python.outputs.python-path }}'
          tox --installpkg '${{ needs.prepare.outputs.wheel-distribution }}'
          -- -rFEx --durations 10 --color yes # pytest args
      - name: Generate coverage report
        run: pipx run coverage lcov -o coverage.lcov
      - name: Upload partial coverage report
        uses: coverallsapp/github-action@main
        if: ${{ matrix.platform != 'macos-12' }}
        with:
          path-to-lcov: coverage.lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.platform }} - py${{ matrix.python }}
          parallel: true
      - name: Save coverage report
        if: ${{ matrix.platform == 'ubuntu-latest' && matrix.python == '3.11' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: htmlcov

  finalize:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Finalize coverage report
        uses: coverallsapp/github-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  benchmark:
    needs: finalize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: github-app-checkout
        with:
          app-id: ${{ secrets.BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            foapy-asv-results

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: intervals-mining-lab/foapy-asv-results
          path: benchmarks/results
          ref: main
          token: ${{ steps.github-app-checkout.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        id: setup-python
        with: {python-version: "3.11"}

      - name: Install ASV
        run: |-
          pipx install --python '${{ steps.setup-python.outputs.python-path }}' asv virtualenv build

      - name: Context
        id: context
        uses: cloudposse/github-action-yaml-config-query@v1
        with:
          query: ."${{ github.event_name }}"
          config: |-
            push:
              branch: ${{ github.ref_name }}
              head: ${{ github.sha }}
              base: HEAD~1
            pull_request:
              branch: ${{ github.event.pull_request.head.ref }}
              head: ${{ github.event.pull_request.head.sha }}
              base: ${{ github.event.pull_request.base.sha }}

      - name: Checkout benchmark results
        run: |-
          cd ./benchmarks/results
          git pull
          git checkout ${{ steps.context.outputs.branch }} || true
          git checkout -b ${{ steps.context.outputs.branch }} --track origin/${{ steps.context.outputs.branch }} || true

      - name: Run benchmark
        id: benchmark
        env:
          QUICK_BENCHMARK: ${{ ! contains( github.event.pull_request.labels.*.name, 'benchmark') }}
        run: |-
          cd ./benchmarks
          asv machine --machine gh-runner --yes || true
          asv setup -v || true
          # Measure both revisions on this runner so the comparison does not
          # mix results from different ephemeral GitHub-hosted machines.
          printf '%s\n' \
            '${{ steps.context.outputs.base }}' \
            '${{ steps.context.outputs.head }}' \
            > ./comparison_commits.txt
          asv run \
            HASHFILE:comparison_commits.txt \
            --interleave-rounds \
            --machine gh-runner || true
          asv publish

          asv compare \
            --machine gh-runner \
            --split \
            --only-changed \
            '${{ steps.context.outputs.base }}' \
            '${{ steps.context.outputs.head }}' \
            > ./benchmark_report.md || true

          if [ -s ./benchmark_report.md ]; then
            python - <<'PY'
          import os
          from pathlib import Path

          report = Path("benchmark_report.md").read_text(encoding="utf-8")
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          suffix = (
              "\n\n_Report truncated. "
              f"[Open the workflow run]({run_url}) or download the "
              "`benchmark-report` artifact for the complete comparison._\n"
          )


          def excerpt(prefix, byte_limit):
              complete = prefix + report
              if len(complete.encode("utf-8")) <= byte_limit:
                  return complete

              budget = byte_limit - len((prefix + suffix).encode("utf-8"))
              lines = []
              size = 0
              for line in report.splitlines(keepends=True):
                  line_size = len(line.encode("utf-8"))
                  if size + line_size > budget:
                      break
                  lines.append(line)
                  size += line_size
              return prefix + "".join(lines) + suffix


          Path("benchmark_summary.md").write_text(
              excerpt("", 900_000), encoding="utf-8"
          )
          Path("benchmark_comment.md").write_text(
              excerpt("<!-- add-pr-comment:add-pr-comment -->\n\n", 60_000),
              encoding="utf-8",
          )
          PY
            cat ./benchmark_summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

          cd ./results
          git pull
          git config user.email "ci-bot@example.com"
          git config user.name "ci-bot"
          git add .
          git commit -m "Update benchmark results" || true

      - uses: actions/create-github-app-token@v3
        id: github-app-push
        with:
          app-id: ${{ secrets.BOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.BOT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            foapy-asv-results

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ steps.github-app-push.outputs.token }}
          repository: intervals-mining-lab/foapy-asv-results
          branch: ${{ steps.context.outputs.branch }}
          directory: benchmarks/results

      - name: Update benchmark PR comment
        if: ${{ github.event_name == 'pull_request' && steps.benchmark.outputs.has_report == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |-
          comment_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '[.[] | select(.body | startswith("<!-- add-pr-comment:add-pr-comment -->"))][-1].id // empty'
          )"
          if [ -n "$comment_id" ]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F body=@benchmarks/benchmark_comment.md
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@benchmarks/benchmark_comment.md
          fi

      - name: Save benchmark website
        uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmarks/html

      - name: Save benchmark comparison
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: benchmarks/benchmark_report.md

  docs:
    needs: benchmark
    runs-on: ubuntu-latest
    env:
      GIT_COMMITTER_NAME: ci-bot
      GIT_COMMITTER_EMAIL: ci-bot@example.com
    steps:
      - name: Context
        id: context
        uses: cloudposse/github-action-yaml-config-query@v1
        with:
          query: ."${{ github.event_name }}"
          config: |-
            push:
              branch: ${{ github.ref_name }}
            pull_request:
              branch: ${{ github.event.pull_request.head.ref }}

      - name: Sanitize docs version
        id: version
        run: |
          # mike/mkdocs versions can't contain "/", but branch names can
          # (e.g. "goruha/sync-openspec-specs"), so slugify it here.
          echo "docs-version=$(echo '${{ steps.context.outputs.branch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with: {fetch-depth: 0}  # deep clone for setuptools-scm

      - uses: actions/setup-python@v7
        id: setup-python
        with: {python-version: "3.11"}

      - name: Retrieve coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: htmlcov

      - name: Retrieve benchmark report
        uses: actions/download-artifact@v8
        with:
          name: benchmark
          path: benchmarks/html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build package distribution files
        run: |
          pipx run --python '${{ steps.setup-python.outputs.python-path }}' tox -e docs
          pipx run --python '${{ steps.setup-python.outputs.python-path }}' tox -e docs-deploy -- ${{ steps.version.outputs.docs-version }}

      - name: Set default documentation branch
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          pipx run --python '${{ steps.setup-python.outputs.python-path }}' tox -e docs-default -- ${{ steps.version.outputs.docs-version }}


  publish:
    needs: finalize
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - name: Retrieve pre-built distribution files
        uses: actions/download-artifact@v8
        with: {name: python-distribution-files, path: dist/}
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
